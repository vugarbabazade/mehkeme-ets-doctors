<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allerqologiya — Quiz</title>
  <style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --line:#e4e7ec;
  --accent:#2563eb; --accent2:#1d4ed8; --ok:#16a34a; --bad:#dc2626; --warn:#f59e0b; --soft:#eff6ff;
}
* { box-sizing:border-box; }
html, body { max-width:100%; height:100%; overflow:hidden; }
html { scroll-padding-top:110px; }
body { margin:0; min-height:100vh; display:flex; flex-direction:column; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text); }
header { flex:0 0 auto; position:relative; top:0; z-index:10; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); box-shadow:0 1px 2px rgba(16,24,40,.04); }
.header-inner { max-width:1180px; margin:0 auto; padding:10px 14px 6px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
h1 { margin:0; font-size:18px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta { display:flex; gap:7px; color:var(--muted); font-size:12px; white-space:nowrap; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.meta span { background:#f8fafc; border:1px solid #eef2f7; border-radius:999px; padding:3px 7px; }
.meta strong { color:var(--text); }
.controls-wrap { max-width:1180px; margin:0 auto; padding:6px 14px 10px; }
.controls { display:flex; flex-wrap:wrap; gap:7px; align-items:center; width:100%; }
.search { flex:1 1 210px; min-width:160px; }
.source { flex:0 1 190px; min-width:150px; }
input[type="search"], select { width:100%; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13px; background:#fff; min-height:36px; }
button, .file-btn, .toggle { border-radius:9px; padding:8px 10px; font-size:12.5px; font-weight:800; cursor:pointer; min-height:36px; white-space:nowrap; }
button { border:0; background:var(--accent); color:#fff; }
button:hover { background:var(--accent2); }
button.secondary { background:#101828; }
button.ghost, .file-btn, .toggle { background:#fff; color:var(--text); border:1px solid var(--line); }
.toggle { display:inline-flex; align-items:center; gap:6px; user-select:none; }
.toggle input { width:14px; height:14px; margin:0; }
.toggle.edit { border-color:#bfdbfe; background:#eff6ff; color:#1d4ed8; }
.toggle.edit.active { background:#dbeafe; border-color:#60a5fa; }
.file-input { display:none; }
.upload-status { color:var(--muted); font-size:11px; flex:1 1 140px; min-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mobile-panel-btn { display:none; }
main { flex:1 1 auto; min-height:0; width:100%; max-width:1180px; margin:0 auto; padding:12px 14px 50px; overflow-y:auto; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; }
.stats { position:sticky; top:0; z-index:5; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:9px; margin:0 0 12px; padding:0 0 8px; background:linear-gradient(var(--bg) 78%, rgba(245,247,251,0)); }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 10px; }
.stat .n { font-size:18px; font-weight:900; }
.stat .label { color:var(--muted); font-size:12px; }
.question-card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; padding:14px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
.question-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
.q-title { font-weight:850; font-size:15px; line-height:1.45; min-width:0; }
.badges { display:none; flex-wrap:wrap; justify-content:flex-end; gap:5px; max-width:42%; }
body.show-sources .badges { display:flex; }
.badge { font-size:11px; color:#344054; background:#f2f4f7; border:1px solid #eaecf0; border-radius:999px; padding:3px 7px; white-space:nowrap; }
.options { display:grid; gap:7px; margin-top:8px; }
.option { display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:#fff; cursor:pointer; transition:.12s ease; }
.option:hover { background:#f9fafb; }
.option input { margin-top:3px; flex:0 0 auto; }
.option.correct { border-color:#86efac; background:#f0fdf4; }
.option.wrong { border-color:#fecaca; background:#fef2f2; }
.option span { overflow-wrap:anywhere; }
.answer { display:none; margin-top:10px; padding:9px 10px; border-radius:11px; background:#fffbeb; border:1px solid #fde68a; font-size:13.5px; }
.answer.show { display:block; }
.result { margin-top:9px; font-weight:850; font-size:13px; }
.result.ok { color:var(--ok); }
.result.bad { color:var(--bad); }
.edit-tools { display:none; margin-top:10px; padding:10px; border:1px dashed #93c5fd; background:#eff6ff; border-radius:11px; align-items:center; gap:8px; flex-wrap:wrap; }
body.edit-mode .edit-tools { display:flex; }
.edit-tools label { font-size:12px; font-weight:800; color:#1d4ed8; }
.edit-tools select { width:auto; min-width:72px; padding:7px 9px; min-height:32px; }
.edit-note { color:#475467; font-size:12px; }
.empty { text-align:center; color:var(--muted); padding:34px 10px; }
.hidden { display:none !important; }
@media (max-width:860px) {
  .header-inner { padding:8px 10px 5px; }
  h1 { font-size:16px; }
  .meta span:nth-child(2), .meta span:nth-child(4) { display:none; }
  .controls-wrap { padding:5px 10px 8px; }
  .mobile-panel-btn { display:inline-flex; align-items:center; justify-content:center; }
  .controls.collapsed .hide-mobile { display:none; }
  .controls { gap:6px; }
  .search { flex:1 1 100%; }
  .source { flex:1 1 46%; min-width:130px; }
  button, .file-btn, .toggle { min-height:34px; padding:7px 8px; font-size:12px; }
  .upload-status { display:none; }
  main { margin-top:0; padding:8px 10px 40px; }
  .stats { grid-template-columns:repeat(4,1fr); gap:6px; }
  .stat { padding:7px 6px; border-radius:10px; }
  .stat .n { font-size:15px; }
  .stat .label { font-size:10px; }
  .question-card { padding:11px; margin:8px 0; border-radius:12px; }
  .question-top { flex-direction:column; gap:7px; }
  .q-title { font-size:14px; }
  .badges { max-width:100%; justify-content:flex-start; }
  .option { padding:8px 9px; font-size:13.5px; }
}
@media (max-width:480px) {
  .controls { display:grid; grid-template-columns:1fr 1fr; }
  .search { grid-column:1 / -1; }
  .source { grid-column:1 / -1; }
  .stats { grid-template-columns:repeat(2,1fr); }
  .header-inner { align-items:flex-start; flex-direction:column; gap:2px; }
}
@media print {
  header, .stats, button, .file-btn, .toggle, .edit-tools { display:none !important; }
  body { background:white; } main { margin:0; max-width:none; } .question-card { box-shadow:none; break-inside:avoid; } .answer { display:block; } .badges { display:flex; }
}
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Allerqologiya — Quiz</h1>
    <div class="meta">
      <span>Ümumi: <strong id="totalMeta">298</strong></span>
      <span>Görünən: <strong id="visibleMeta">298</strong></span>
      <span>Cari: <strong id="currentMeta">1/298</strong></span>
      <span>Nəticə: <strong id="scoreMeta">0/0</strong></span>
    </div>
  </div>
  <div class="controls-wrap">
    <div class="controls collapsed" id="controls">
      <input class="search" type="search" id="search" placeholder="Axtar...">
      <select class="source hide-mobile" id="sourceFilter"><option value="">Bütün mənbələr</option></select>
      <button class="ghost mobile-panel-btn" id="panelBtn" type="button">Panel</button>
      <label class="toggle edit hide-mobile" id="editToggleLabel" title="Aktiv olduqda düzgün cavabı dəyişmək mümkün olur"><input type="checkbox" id="editMode"> Edit</label>
      <button class="ghost hide-mobile" type="button" id="clearEditsBtn" title="Yadda saxlanmış cavab düzəlişlərini sil">Düzəlişləri sil</button>
      <button class="ghost hide-mobile" type="button" id="shareEditsBtn" title="Düzəlişləri linkin içinə yaz və paylaşmaq üçün kopyala">Paylaş linki</button>
      <label class="file-btn hide-mobile" for="excelFile" title="Excel və ya CSV yüklə">Excel</label>
      <input class="file-input" type="file" id="excelFile" accept=".xlsx,.xls,.csv">
      <label class="toggle hide-mobile" title="Cavabı seçən kimi düzgün cavab göstərilsin"><input type="checkbox" id="instantMode"> Dərhal</label>
      <label class="toggle hide-mobile" title="Sualın PDF/səhifə mənbəsini göstər"><input type="checkbox" id="sourceMode"> Mənbə</label>
      <button class="ghost hide-mobile" type="button" id="shuffleBtn">Qarışdır</button>
      <button type="button" id="checkBtn">Yoxla</button>
      <button class="ghost hide-mobile" type="button" id="answersBtn">Cavab</button>
      <button class="secondary hide-mobile" type="button" id="resetBtn">Sıfırla</button>
      <span class="upload-status" id="uploadStatus">Onkologiya bazası hazırdır</span>
    </div>
  </div>
</header>
<main id="quizScroll" aria-label="Sual siyahısı">
  <div class="stats">
    <div class="stat"><div class="n" id="visibleCount">0</div><div class="label">Görünən</div></div>
    <div class="stat"><div class="n" id="answeredCount">0</div><div class="label">Cavablanmış</div></div>
    <div class="stat"><div class="n" id="correctCount">0</div><div class="label">Düzgün</div></div>
    <div class="stat"><div class="n" id="wrongCount">0</div><div class="label">Səhv</div></div>
  </div>
  <div id="questions"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const INITIAL_QUESTIONS = [{"id":1,"question":"Tip I anafilaktik reaksiyada aşağıdakılardan hansı ifraz olunmaz?","options":{"A":"Serotonin","B":"Prostaqlandin D2","C":"Trombositləri aktivləşdirən faktor","D":"Interleykin 1","E":"Histamin"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"1","excelNo":"1"},{"id":2,"question":"20 yaşlı xəstə 2-3 ay davam edən tutma şəkilli öskürək, döş qəfəsində/sinədə ağırlıq hissi, fiziki yük zamanı təngnəfəslik, fitverici tənəffüs şikayətləri ilə allerqoloqa müraciət edib. Аuskultasiyada: hər iki tərəfdə yayqın quru fitverici xırıltılar eşidilir. Anamnezindən: uşaq yaşlarında atopik dermatit, qida, dərman allergiyası olub. Hansı xəstəlikdən söhbət gedir?","options":{"A":"Ağciyərlərin emfizeması","B":"Pnevmoniya","C":"Bronxial astma","D":"Kəskin bronxit","E":"Obstruktiv bronxit"},"correct":"C","source":"Ets cavablı_260120_160916(1).pdf","page":"1","excelNo":"2"},{"id":3,"question":"Xəstə bütün bədəndə güclü qaşınma ilə müşahidə olunan urtikarial səpgi şikayəti ilə müraciət edib. Səpgilər 3 gün əvvəl başlayıb, ağrıkəsici qəbulundan 15 dəqiqə sonra; əvvəllər belə hallar olmayıb. Diaqnoz?","options":{"A":"Xroniki övrə","B":"Psoriaz","C":"Qoturluq","D":"Atopik dermatit","E":"Kəskin övrə"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"1","excelNo":"3"},{"id":4,"question":"Aşağıdakılardan hansı allergik xəstəlik deyil?","options":{"A":"Atopik dermatit","B":"Angionevrotik ödem","C":"Pollinoz","D":"Övrə","E":"İxtioz"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"1","excelNo":"4"},{"id":5,"question":"İmmunoqlobulin IgE-nin qanda miqdarının artması hansı xəstəlik üçün xarakterikdir?","options":{"A":"Dərman mənşəli trombositopeniya","B":"Qırmızı qurd eşənəyi","C":"Kontakt dermatit","D":"Xroniki bronxit","E":"Allergik rinit"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"1","excelNo":"5"},{"id":6,"question":"Aspirin induksiyalı tənəffüs yolu xəstəliyində (bronxial astma) hansı dərman preparatını istifadə etmək olmaz?","options":{"A":"Prednizolon","B":"Beta agonistlər","C":"Simpatomimetiklər","D":"Penisillin qrup antibiotiklər","E":"Qeyri-steroid iltihab əleyhinə olan preparatlar"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"2","excelNo":"6"},{"id":7,"question":"Bu əlamətlərdən hansı qida allergiyasının dəri ifadələrinə xas deyil?","options":{"A":"Övrə","B":"Dərinin eriteması","C":"Kontakt övrə (təmas övrəsi)","D":"Dəri atrofiyası","E":"Dəri qaşınması"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"2","excelNo":"7"},{"id":8,"question":"Zərdab xəstəliyinin inkişafında hansı tip mexanizm başlıca rol oynayır?","options":{"A":"IV tip: hüceyrə mexanizmi","B":"Autoimmun mexanizm","C":"I tip: reaqin mexanizmi","D":"II tip sitotoksik mexanizm","E":"III tip: immun kompleks mexanizm"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"2","excelNo":"8"},{"id":9,"question":"Zərdab xəstəliyinin kliniki əlamətlərinə hansılar aid deyil?","options":{"A":"Artrit","B":"Temperaturun yüksəlməsi","C":"Qızılcayabənzər səpgilər","D":"Limfa düyünlərinin böyüməsi","E":"Dərinin qabıqlanması"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"2","excelNo":"9"},{"id":10,"question":"Allergik rinitin əsas simptomlarına hansı aid deyil?","options":{"A":"Burun tənəffüsünün pozulması","B":"Asqırma","C":"Burundan xeyli miqdarda selikli ifrazat","D":"Burunda qaşınma","E":"Burundan irinli ifrazat"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"2","excelNo":"10"},{"id":11,"question":"Aşağıdakı müalicə vasitələrindən hansı allergik rinitin gedişatını dəyişərək uzunmüddətli remissiyaya səbəb olur?","options":{"A":"Membran stabilizatorlarla","B":"Qlükokortikosteroidlərlə","C":"Dekonqestantlarla (məsələn, naftizin, ksimelin)","D":"Antihistaminlərlə","E":"Allergen spesifik immunoterapiya (ASIT)"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"3","excelNo":"11"},{"id":12,"question":"Atopik dermatitin ən əsas əlaməti hansıdır?","options":{"A":"E) Erkən yaşdan başlayır","B":"B) Ümumi İqE səviyyəsinin artması","C":"C) Kseroz (dəri quruluğu)","D":"D) Qanda eozinofiliya","E":"Dəri qaşınması"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"3","excelNo":"12"},{"id":13,"question":"Dərmanlara qarşı həm vazo-vaqal, həm də anafilaktik reaksiya ola bilər. Hər ikisində kollaps və hipotenziya qeyd oluna bilər. Birindən başqa hamısı daha çox vazo-vaqal reaksiyaya aiddir:","options":{"A":"Tərləmə","B":"Halsızlıq","C":"Qızartı, övrə, qaşıntı","D":"Rəngin avazıması","E":"Bradikardiya"},"correct":"C","source":"Ets cavablı_260120_160916(1).pdf","page":"3","excelNo":"13"},{"id":14,"question":"Atopik dermatitdə istifadə olunan əsas müalicə vasitəsi hansıdır?","options":{"A":"Antihistamin preparatlar","B":"Fungisid məlhəmlər","C":"Sistemli qlükokortikosteroidlər","D":"Antibakterial məlhəmlər","E":"Qlükokortikosteroid məlhəmləri"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"3","excelNo":"14"},{"id":15,"question":"Allergik Kvinke ödeminin reqressiyasında dəridə nə qalır?","options":{"A":"Hiperpiqmentasiya","B":"Dərinin atrofiyası","C":"Hipopiqmentasiya","D":"Çapıq","E":"Hər hansı bir dəyişiklik olmur"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"3","excelNo":"15"},{"id":16,"question":"Yerli təsirli simpatomimetiklər (oksimetazolin, ksilometazolin, fenilefrin və s.) allergik rinitin əsasən hansı əlamətini aradan qaldırır?","options":{"A":"Burun qaşınmasını azaldır","B":"Burnun selikli qişasının damarlarını genişləndirir","C":"Selikli qişanın ödemini","D":"Təsiri yoxdur","E":"Asqırmanı azaldır"},"correct":"C","source":"Ets cavablı_260120_160916(1).pdf","page":"4","excelNo":"16"},{"id":17,"question":"Funksional tənəffüs testlərində (spirometriya) obstruktiv tip pozulma göstərən xəstəlik aşağıdakılardan hansıdır?","options":{"A":"Pnevmoniya","B":"Fibroz","C":"Plevra qalınlaşması","D":"Pulmonar ödem","E":"Emfizema"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"4","excelNo":"17"},{"id":18,"question":"Hansı əlamətlər uzun müddətli xronik öskürəyin tənəffüs yolunun allergik xəstəliyi ilə əlaqədar olmasına dair həkimdə şübhə yaradar?","options":{"A":"Xəstənin öskürəyini bir müddət əvvəl hipertoniya ilə əlaqədar AÇF inhibitorlarının qəbuluna başlaması ilə əlaqələndirməsi","B":"Öskürəyin çoxlu miqdarda bəlğəm ifrazı ilə müşayət olunması","C":"Öskürəyin uzanıqlı vəziyyət alan kimi başlaması və boğaz təmizləmə əlamətinin olması","D":"Yanaşı gedən allergik xəstəliyin olması, ətraf mühitin bəzi faktorlarına məruz qaldıqda öskürəyin yaranması, gecə yarısı öskürəyə görə yuxudan oyanma","E":"Xəstənin artıq çəkili olması və öskürəyin yeməkdən sonra başlaması"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"4","excelNo":"18"},{"id":19,"question":"Anafilaksiya zamanı hansı halda xəstəyə supin deyil oturaqlı vəziyyət verilə bilər?","options":{"A":"Bu vəziyyət qətiyyən yolverilməzdir","B":"Xəstə hamilədirsə","C":"Xəstə emosional hiperaktiv olarsa","D":"Tənəffüsün çətinləşməsi ilə gedən anafilaksiyalarda","E":"Təzyiqin ciddi dərəcədi enməsi ilə gedən anafilaksiyalarda"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"4","excelNo":"19"},{"id":20,"question":"Hansı fikir doğrudur?","options":{"A":"İnək südü allergiyası olan uşaqlarda bu vəziyyət bütün hallarda ömür boyu davam edir","B":"İnək südü allergiyası olanlar adətən süd məhsullarını problemsiz yeyə bilirlər","C":"İnək südü allergiyası olanlar inək ətinə də reaksiya göstərəcəklər","D":"İnək südü zülalına allergiyası olan uşaqlarda, eyni reaksiya gözlənildiyindən keçi südü də verilməməlidir","E":"İnək südü allergiyası olanlara qoyun südü verilə bilər"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"5","excelNo":"20"},{"id":21,"question":"Hansı fikir doğru deyil?","options":{"A":"Atopik dermatitli xəstələrin dərisi ikincili infeksiyalara meyillidir","B":"Atopik dermatitli xəstələrdə total dəri quruluğu qeyd olunur","C":"Atopik dermatit adətən uşaqlıq çağında başlanır","D":"Allergik testlərin (dəri prik testi və qanda spesifik İgE) nəticəsi neqativ olan xəstəyə atopik dermatit diaqnozu qoyula bilməz","E":"Qaşıntı atopik dermatitin ən əsas əlamətidir"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"5","excelNo":"21"},{"id":22,"question":"Hansı nahiyə Anafilaksiya zamanı adrenalin inyeksiyası üçün ən uyğun yerdir?","options":{"A":"Adrenalin subkutan inyeksiya olunmalıdır","B":"Adrenalin venaya inyeksiya olunmalıdır","C":"Deltayabənzər əzələyə","D":"Sarğıya","E":"Budun ön lateral hissəsi – vastus lateralis əzələyə"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"5","excelNo":"22"},{"id":23,"question":"Şübhəli qida allergiyası diaqnozunun təsdiqində hansı müayinə daha çox informativdir?","options":{"A":"Qanın ümumi analizi","B":"Bazofillərdən histaminin sintezi testi","C":"Dəri prik testi","D":"Total İgE","E":"Qanda eozinofiliya"},"correct":"C","source":"Ets cavablı_260120_160916(1).pdf","page":"5","excelNo":"23"},{"id":24,"question":"Aşağıdakı allergik xəstəliklərdən hansında immunoterapiya aparılmır?","options":{"A":"Mövsümlü allergik rinit","B":"İl boyu sürən allergik rinit","C":"Allergik astma + allergik rinit","D":"Qeyriallergik bronxial astma","E":"Allergik bronxial astma"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"5","excelNo":"24"},{"id":25,"question":"Hansı xəstəlik qida allergiyasının İgE vasitəli olmayan klinik təzahürünə aiddir?","options":{"A":"Atopik dermatit","B":"Anafilaksiya","C":"Oral allergik sindrom","D":"Kəskin övrə","E":"Həyatın ilk aylarında görünən proktokolitlər"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"6","excelNo":"25"},{"id":26,"question":"Obstruktiv pozulmanın olduğunu aşağıdakılardan hansı ən dəqiq göstərir?","options":{"A":"Komplayensin (elastikliyin) azalması","B":"Total ağciyər həcminin (TLC) artması","C":"FEV1 (1-ci saniyədəki güclənmiş ekspirator həcmin) azalması","D":"Qalıq həcmin artması","E":"Azalmış FEV1 fonunda FEV1/FVC (1-ci saniyədəki güclənmiş ekspirator həcmin/ güclənmiş həyat tutumuna nisbətin) azalması"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"6","excelNo":"26"},{"id":27,"question":"Aşağıdakılardan hansında spirometriyada FEV1 və FEV1/FVC azalmasına səbəb olmaz?","options":{"A":"Bronxoektaziya","B":"Mukovistsidoz (kistik fibroz)","C":"Emfizema","D":"Bronxial astma","E":"Radiasion pnevmoniya"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"6","excelNo":"27"},{"id":28,"question":"Aşağıdakı xəstələrdən hansında irsi angionevrotik ödemdən şübhələnmək doğru olardı?","options":{"A":"Ödemlər göz ətrafında təkrarlanırsa","B":"Xəstədə təkrarlanan ödemlər var və bu ödemlər antihistaminlərin, kortizonun və adrenalinin istifadəsindən qətiyyən düzəlmir","C":"Ödemlər təkrarlanır və hər zaman övrə səpgisi ilə müşayət olunur","D":"Ödemlər antihistaminlərə cavab verməsə də, qlükokortikoidlərin istifadəsindən keçirsə","E":"Ödemlər əldədirsə"},"correct":"B","source":"Ets cavablı_260120_160916(1).pdf","page":"6","excelNo":"28"},{"id":29,"question":"Aşağıdakı fikirlərdən hansı övrə diaqnozunun qoyulmasında əsas götürülə bilər?","options":{"A":"Səpgilər antihistamin dərmanlara cavab vermirsə övrə diaqnozu inkar olunur","B":"Total İgE normadan yüksək deyilsə diaqnoz inkar olunur","C":"Yaranan səpgilər hərarətlə müşayət olunmursa (səpginin davametmə müddəti əhəmiyyətli deyil)","D":"Səpgilər 48-72 saat davam edirsə","E":"Səpgiləri 24 saat içində iz buraxmadan keçirsə və xəstənin sistemik simptomları yoxdursa"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"7","excelNo":"29"},{"id":30,"question":"Övrə xəstəliyinin müalicəsində ilk sıra preparatlar hansı olmalıdır?","options":{"A":"Omalizumab","B":"Birinci nəsil antihistaminlər","C":"Sistemik qlükokortikosteroidlər","D":"Adrenalin","E":"İkinci nəsil antihistaminlər (qeyri sedativ)"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"7","excelNo":"30"},{"id":31,"question":"Hansı fikir doğrudur?","options":{"A":"AD yerli müalicəsində antihistamin tərkibli mazlar ilk seçim preparatıdır","B":"AD yerli müalicəsində kalsinevrin inhibitorları ilk seçim preparatlarıdır","C":"İmmunomodulyatorlar AD müalicəsində ilk seçim preparatlarıdır","D":"Atopik dermatitin müalicəsində difenhidramin hidroxlorid hətta monoterapiya kimi istifadə oluna bilər","E":"Atopik dermatitin yerli müalicəsində zəif potensiyalı qlükokortikoidlər ilk seçim preparatları olmalıdırlar"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"7","excelNo":"31"},{"id":32,"question":"Astma kəskinləşməsində xəstənin özünə yardım kimi istifadə etməli olduğu ilk seçim preparatı aşağıdakılardan hansı olmalıdır?","options":{"A":"v/d MgSO4","B":"Aminofillin","C":"Antixolinergiklər","D":"İKS(inhalyasyon qlükokortikoid)-formoterol;","E":"Teofillin"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"7","excelNo":"32"},{"id":33,"question":"Astmalı xəstə ağrıkəsici istifadəsindən az sonra hipotenziya, nəfəs darlığı və övrə səpgisi şikayətləriylə müraciət edir. Bu xəstəyə aşağıdakı dərmanlardan hansı təcili şəkildə istifadə olunmalıdır?","options":{"A":"deksametason","B":"Atropin","C":"Difenhidramin (dimedrol)","D":"Adrenalin","E":"Teofillin"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"7","excelNo":"33"},{"id":34,"question":"Hansı xəstəliyin mexanizmində İgE iştirak etmir?","options":{"A":"Allergik rinit","B":"Bronxial astma","C":"Kontakt dermatit","D":"Atopik dermatit","E":"Övrə"},"correct":"C","source":"Ets cavablı_260120_160916(1).pdf","page":"8","excelNo":"34"},{"id":35,"question":"5 yaşdan aşağı boğulma tutmaları olan uşaqlarda bu hal çox zaman yaş artdıqca keçib gedir. Yalnız bir qrup xəstələrə bronxial astma diaqnozu qoyulur və həkim bu diaqnozu qoyarkən nəyə əsaslanmalıdır?","options":{"A":"Ağır boğulma tutması keçirən bu yaşdakı hər uşağa bronxial astma diaqnozu qoyula bilər","B":"Uşağın artıq çəkili olması və hər respirator virus xəstəliyi zamanı boğulması","C":"Bu yaş qrupunda həkim BA diaqnozu qoymaq üçün mütləq spirometriyanın nəticəsinə əsaslanmalıdır","D":"Yanaşı gedən allergik xəstəliyin olması, uşağın ailə üzvlərində astma, tutma arası dövrdə fiziki və emosional aktivlik zamanı simptomlar və astma müalicəsinə yaxşı cavabın olması","E":"Ailə üzvləri arasında astma diaqnozu olan xəstə varsa elə ilk boğulma tutması keçirən uşağa BA diaqnozu qoyula bilər"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"8","excelNo":"35"},{"id":36,"question":"Aşağıdakılardan hansı zərdab xəstəliyində qeyd olunan əlamətlərə aid deyildir?","options":{"A":"Leykopeniya","B":"Artrit","C":"Temperaturun yüksəlməsi","D":"Qanlı ishal","E":"Yayqın övrə"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"8","excelNo":"36"},{"id":37,"question":"Allergik xəstələrdə periferik qanda görünən eozinofiliyaya səbəb olan sitokin hansıdır?","options":{"A":"IL-1","B":"TNF-alfa","C":"IL-5","D":"IL-4","E":"IL-3"},"correct":"C","source":"Ets cavablı_260120_160916(1).pdf","page":"8","excelNo":"37"},{"id":38,"question":"Hansı əlamət təklikdə Anafilaksiya diaqnozu qoymaq üçün yetərlidir?","options":{"A":"Övrə","B":"Huşun itirilməsi","C":"Qeyri iradi nəcis sidik ifrazı","D":"Hipotenziya","E":"Angionevrotik ödem"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"9","excelNo":"38"},{"id":39,"question":"Xronik övrənin müalicəsində xəstə antihistaminlərin ənənəvi dozasına cavab vermirsə növbəti addım necə olmalıdır?","options":{"A":"Plazmoferez","B":"Siklosporinə keçmək","C":"Sistemik kortikosteroidlərdən istifadə etmək","D":"İkinci nəsil antihistamin preparatının dozasını gündə 4 tabletə qədər artırmaq","E":"Omalizumaba keçmək"},"correct":"D","source":"Ets cavablı_260120_160916(1).pdf","page":"9","excelNo":"39"},{"id":40,"question":"Hansı xəstəlikdə _160916(1).pdf","page":"10","excelNo":"44"},{"id":45,"question":"Hansı müayinə ilə İrsi angionevrotik ödem diaqnozu təsdiqlənər?","options":{"A":"İL-5 və İL-13 səviyyəsinə əsasən","B":"Qanda TNF-alfa səviyyəsinə əsasən","C":"Total İgE səviyyəsinin çox yüksək olması","D":"Total İgE səviyyəsinin çox aşağı olması","E":"Qanda C1inh-nun kəmiyyət və ya keyfiyyət çatışmamazlığı"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"10","excelNo":"45"},{"id":46,"question":"Hamilə qadında anafilaksiya qeyd olunarsa, aortokaval damarların uşaqlıqla sıxılmasının, və bununla hipotenziyanın daha da dərinləşməsinin qarşısını almaq üçün, yardım hansı pozisiyada göstərilməlidir?","options":{"A":"Sağ böyürü üstə uzandırılmalıdır","B":"Sol böyürü üstə uzandırılmalıdır","C":"Arxasıüstə uzandırılmalıdır","D":"Pozisiyanın əhəmiyyəti yoxdur","E":"Uzandırmaq olmaz"},"correct":"B","source":"Ets cavablı_260120_160916(1).pdf","page":"10","excelNo":"46"},{"id":47,"question":"Birindən başqa hamısı anafilaksiyada epinefrinin terapevtik təsirinə aiddir:","options":{"A":"Ürəyə müsbət inotrop və xronotrop təsiri","B":"Beta-2 adrenergik agonist təsiri","C":"Beta-1 adrenergik agonist təsiri","D":"Alfa-1 adrenergik agonist təsiri","E":"Beta-blokator təsiri"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"11","excelNo":"47"},{"id":48,"question":"Böyüklərdə arterial təzyiqin hansı göstəriciləri anafilaktik şoka uyğundur?","options":{"A":"Diastolik təzyiqin <70 mm c.s. enməsi","B":"Sistolik təzyiqin individual normadan 10%-dan daha az enməsi","C":"Anafilaktik şok zamanı sistolik təzyiqdə heç bir dəyişikliklər qeyd olunmur","D":"Sistolik təzyiqin individual normadan 20%-dan artıq olması","E":"Sistolik təzyiqin <90 mm c st və ya fərdi normadan 30%-dan artıq enməsi"},"correct":"E","source":"Ets cavablı_260120_160916(1).pdf","page":"11","excelNo":"48"},{"id":49,"question":"Aşağıdakı dərman vasitələrdən hamısı, birindən başqa, adətən anafilaktoid (qeyri-immunoloji) reaksiyaya 93,"question":"Aşağıdakı klinik patologiyalardan hansı üçün dəri səpgiləri, eozinofiliya və /və ya atipik limfositoz və sistemik simptomlar xarakterikdir?","options":{"A":"Sabit eritema","B":"Stivens-Conson sindromu","C":"Toksik epidermal nekroliz","D":"DRESS sindromu","E":"Anafilaktik şok"},"correct":"D","source":"Allerqologiya 2025 yaz _250610_152529 (2).pdf","page":"33","excelNo":"192"},{"id":294,"question":"DRESS sindromunun diaqnostikası üçün hansı laborator göstəricilər əhəmiyyətlidir?","options":{"A":"Trombositoz","B":"Müsbət antinüvə anticisimləri (ANA)","C":"Leykopeniya","D":"IgE səviyyəsinin artması","E":"Qanın ümumi analizində eozinofiliya və/və ya atipik limfositoz"},"correct":"E","source":"Allerqologiya 2025 yaz _250610_152529 (2).pdf","page":"33","excelNo":"193"},{"id":295,"question":"DRESS sindromunun müalicəsi nəyə əsaslanır?","options":{"A":"Kimyaterapiyasi","B":"Plazmaferez","C":"Sistemli antibiotiklər","D":"Antihistaminlər","E":"Səbəbkar dərmanın dərhal dayandırılması və kortikosteroidlərin verilməsi"},"correct":"E","source":"Allerqologiya 2025 yaz _250610_152529 (2).pdf","page":"33","excelNo":"194"},{"id":296,"question":"Hansı dəri elementləri çoxformalı ekssudativ eritema üçün patoqnomonikdir?","options":{"A":"Dəridə xətti zolaqlar","B":"Qabıqlanan lövhələr","C":"Kiçik nöqtəli qansızmalar","D":"İrin tərkibli pustulalar","E":"Üç zonalı hədəf papulalar"},"correct":"E","source":"Allerqologiya 2025 yaz _250610_152529 (2).pdf","page":"33","excelNo":"195"},{"id":297,"question":"Hansı lokalizasiya çoxformalı ekssudativ eritema səpgisi üçün ən xarakterikdir?","options":{"A":"Əl və ayaq","B":"Bel nahiyəsi","C":"Baş dərisi","D":"Ağız boşluğunun və cinsiyyət orqanlarının selikli qişaları","E":"Ətrafların simmetrik açıcı səthləri"},"correct":"E","source":"Allerqologiya 2025 yaz _250610_152529 (2).pdf","page":"34","excelNo":"196"},{"id":298,"question":"Çoxformalı eksudativ eritema övrədən nə ilə fərqlənir?","options":{"A":"Selikli qişaların zədələnməsi","B":"Antihistaminlərə cəvab","C":"Allergenlərlə əlaqə","D":"Səpgi elementlərinin müddəti (1-4 həftə)","E":"Qaşıntının olması"},"correct":"D","source":"Allerqologiya 2025 yaz _250610_152529 (2).pdf","page":"34","excelNo":"197"}];
let questions = structuredClone(INITIAL_QUESTIONS);
let filteredIds = new Set();
let showAllAnswers = false;
let optionOrder = {};
let currentQuestionObserver = null;
const letters = ['A','B','C','D','E'];
const el = id => document.getElementById(id);
const CORRECTION_STORAGE_KEY = 'fizio_quiz_correct_overrides_v1';

function correctionKey(q) {
  return `${q.id}::${String(q.question || '').trim().slice(0, 140)}`;
}
function readSavedCorrections() {
  try { return JSON.parse(localStorage.getItem(CORRECTION_STORAGE_KEY) || '{}') || {}; }
  catch { return {}; }
}
function writeSavedCorrections(data) {
  try { localStorage.setItem(CORRECTION_STORAGE_KEY, JSON.stringify(data)); return true; }
  catch { return false; }
}
function encodeSharePayload(obj) {
  const json = JSON.stringify(obj || {});
  const bytes = new TextEncoder().encode(json);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
function decodeSharePayload(str) {
  try {
    const normalized = String(str || '').replace(/-/g, '+').replace(/_/g, '/');
    const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
    const binary = atob(padded);
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes)) || {};
  } catch { return {}; }
}
function readSharedCorrectionsFromUrl() {
  const hash = window.location.hash || '';
  const match = hash.match(/(?:^#|&)edits=([^&]+)/);
  return match ? decodeSharePayload(match[1]) : {};
}
function getAllCorrections() {
  return { ...readSavedCorrections(), ...readSharedCorrectionsFromUrl() };
}
function persistSharedCorrectionsIfAny() {
  const shared = readSharedCorrectionsFromUrl();
  if (!Object.keys(shared).length) return 0;
  const merged = { ...readSavedCorrections(), ...shared };
  writeSavedCorrections(merged);
  return Object.keys(shared).length;
}
function makeShareableEditsLink() {
  const saved = readSavedCorrections();
  if (!Object.keys(saved).length) {
    alert('Paylaşmaq üçün hələ heç bir edit düzəlişi yoxdur. Əvvəl Edit rejimində düzgün cavabı dəyiş.');
    return;
  }
  const payload = encodeSharePayload(saved);
  const base = window.location.href.split('#')[0];
  const url = `${base}#edits=${payload}`;
  const done = () => { el('uploadStatus').textContent = 'Paylaş linki kopyalandı'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => prompt('Linki kopyala:', url));
  } else {
    prompt('Linki kopyala:', url);
  }
}
function applySavedCorrections() {
  const sharedCount = persistSharedCorrectionsIfAny();
  const saved = getAllCorrections();
  let applied = 0;
  questions.forEach(q => {
    const val = saved[correctionKey(q)];
    if (letters.includes(val)) { q.correct = val; applied++; }
  });
  if (applied) el('uploadStatus').textContent = sharedCount ? `${applied} link/yaddaş düzəlişi tətbiq olundu` : `${applied} yadda saxlanmış düzəliş tətbiq olundu`;
}
function saveCorrectChange(q) {
  const saved = readSavedCorrections();
  saved[correctionKey(q)] = q.correct;
  const ok = writeSavedCorrections(saved);
  el('uploadStatus').textContent = ok ? 'Düzəliş yadda saxlandı' : 'Düzəliş yadda saxlanmadı';
}
function clearSavedCorrections() {
  if (!confirm('Yadda saxlanmış düzgün cavab düzəlişləri silinsin?')) return;
  try { localStorage.removeItem(CORRECTION_STORAGE_KEY); } catch {}
  if (window.location.hash.includes('edits=')) history.replaceState(null, '', window.location.href.split('#')[0]);
  questions = structuredClone(INITIAL_QUESTIONS);
  optionOrder = {};
  resetFilters();
  renderSources();
  renderQuestions();
  el('uploadStatus').textContent = 'Yadda saxlanmış düzəlişlər silindi';
}

function normalizeQuestion(raw, index) {
  const get = (...names) => {
    for (const n of names) {
      if (raw[n] !== undefined && raw[n] !== null && String(raw[n]).trim() !== '') return raw[n];
      const found = Object.keys(raw).find(k => String(k).trim().toLowerCase() === n.toLowerCase());
      if (found && raw[found] !== undefined && raw[found] !== null && String(raw[found]).trim() !== '') return raw[found];
    }
    return '';
  };
  const options = {};
  letters.forEach(L => options[L] = String(get(L, L + ')', 'Option ' + L, 'Variant ' + L) || '').trim());
  let correct = String(get('CorrectLetter','Correct','Answer','Düzgün cavab','Duzgun cavab') || '').trim().toUpperCase().slice(0,1);
  if (!letters.includes(correct)) {
    const ca = String(get('CorrectAnswer','Correct Answer') || '').trim();
    correct = letters.find(L => options[L] === ca) || 'A';
  }
  return {
    id: Number(get('No','№','N','ID')) || index + 1,
    question: String(get('Question','Sual','QuestionText') || '').trim(),
    options,
    correct,
    source: String(get('SourceFile','Source','Mənbə','Menbe') || '').trim(),
    page: String(get('Page','Səhifə','Sehife') || '').trim()
  };
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function correctText(q) { return `${q.correct}) ${q.options[q.correct] || ''}`; }
function getOrder(q) {
  if (!optionOrder[q.id]) optionOrder[q.id] = letters.filter(L => q.options[L]);
  return optionOrder[q.id];
}
function renderSources() {
  const sourceFilter = el('sourceFilter');
  const current = sourceFilter.value;
  const sources = [...new Set(questions.map(q => q.source).filter(Boolean))].sort();
  sourceFilter.innerHTML = '<option value="">Bütün mənbələr</option>' + sources.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  if (sources.includes(current)) sourceFilter.value = current;
}
function renderQuestions() {
  const wrap = el('questions');
  filteredIds.clear();
  const search = el('search').value.trim().toLowerCase();
  const source = el('sourceFilter').value;
  const cards = [];
  questions.forEach((q) => {
    const hay = [q.question, ...letters.map(L => q.options[L]), q.source, q.page].join(' ').toLowerCase();
    if (search && !hay.includes(search)) return;
    if (source && q.source !== source) return;
    filteredIds.add(q.id);
    const visibleNo = cards.length + 1;
    const order = getOrder(q);
    const opts = order.map(L => `<label class="option" data-letter="${L}">
        <input type="radio" name="q${q.id}" value="${L}">
        <span><strong>${L})</strong> ${escapeHtml(q.options[L])}</span>
      </label>`).join('');
    const editOptions = letters.map(L => `<option value="${L}" ${q.correct===L?'selected':''}>${L}</option>`).join('');
    cards.push(`<section class="question-card" data-id="${q.id}" data-source="${escapeHtml(q.source)}" data-correct="${q.correct}">
      <div class="question-top">
        <div class="q-title">${visibleNo}. ${escapeHtml(q.question)}</div>
        <div class="badges">
          ${q.excelNo ? `<span class="badge">№: ${escapeHtml(q.excelNo)}</span>` : ''}
          ${q.source ? `<span class="badge">Source: ${escapeHtml(q.source)}</span>` : ''}
          ${q.page ? `<span class="badge">Page: ${escapeHtml(q.page)}</span>` : ''}
        </div>
      </div>
      <div class="options">${opts}</div>
      <div class="result" aria-live="polite"></div>
      <div class="answer">Düzgün cavab: <strong>${escapeHtml(correctText(q))}</strong></div>
      <div class="edit-tools">
        <label>Düzgün cavab:</label>
        <select class="correct-editor" data-id="${q.id}">${editOptions}</select>
        <span class="edit-note">Edit rejimi aktivdir</span>
      </div>
    </section>`);
  });
  wrap.innerHTML = cards.join('') || '<div class="empty">Uyğun sual tapılmadı.</div>';
  bindQuestionEvents();
  setupCurrentQuestionObserver();
  updateStats();
}
function bindQuestionEvents() {
  document.querySelectorAll('.option input').forEach(inp => {
    inp.addEventListener('change', e => {
      const card = e.target.closest('.question-card');
      clearCardVisual(card);
      if (el('instantMode').checked) revealCard(card, true);
      updateStats();
    });
  });
  document.querySelectorAll('.correct-editor').forEach(sel => {
    sel.addEventListener('change', e => {
      const q = questions.find(x => String(x.id) === String(e.target.dataset.id));
      if (!q) return;
      q.correct = e.target.value;
      saveCorrectChange(q);
      const card = document.querySelector(`.question-card[data-id="${q.id}"]`);
      if (card) {
        card.dataset.correct = q.correct;
        card.querySelector('.answer').innerHTML = `Düzgün cavab: <strong>${escapeHtml(correctText(q))}</strong>`;
        clearCardVisual(card);
      }
      updateStats();
    });
  });
}
function setupCurrentQuestionObserver() {
  if (currentQuestionObserver) currentQuestionObserver.disconnect();
  const cards = [...document.querySelectorAll('.question-card')];
  if (!cards.length) {
    el('currentMeta').textContent = `0/${questions.length}`;
    return;
  }
  el('currentMeta').textContent = `1/${cards.length}`;
  currentQuestionObserver = new IntersectionObserver(entries => {
    const visible = entries
      .filter(entry => entry.isIntersecting)
      .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    const index = cards.indexOf(visible.target) + 1;
    el('currentMeta').textContent = `${index}/${cards.length}`;
  }, { root: el('quizScroll'), threshold:[0.35, 0.55, 0.75], rootMargin:'-8px 0px -45% 0px' });
  cards.forEach(card => currentQuestionObserver.observe(card));
}

function clearCardVisual(card) {
  card.querySelectorAll('.option').forEach(o => o.classList.remove('correct','wrong'));
  const result = card.querySelector('.result');
  result.textContent = ''; result.className = 'result';
  if (!showAllAnswers) card.querySelector('.answer').classList.remove('show');
}
function revealCard(card, markWrong=false) {
  const correct = card.dataset.correct;
  const selected = card.querySelector('input[type="radio"]:checked')?.value;
  card.querySelectorAll('.option').forEach(o => {
    const L = o.dataset.letter;
    o.classList.toggle('correct', L === correct);
    o.classList.toggle('wrong', markWrong && selected && L === selected && selected !== correct);
  });
  const answer = card.querySelector('.answer');
  answer.classList.add('show');
  const result = card.querySelector('.result');
  if (selected) {
    if (selected === correct) { result.textContent = 'Düzgündür'; result.className = 'result ok'; }
    else { result.textContent = 'Səhvdir'; result.className = 'result bad'; }
  }
}
function checkAnswers() {
  document.querySelectorAll('.question-card').forEach(card => revealCard(card, true));
  updateStats(true);
}
function toggleAnswers() {
  showAllAnswers = !showAllAnswers;
  document.querySelectorAll('.question-card').forEach(card => {
    if (showAllAnswers) revealCard(card, false);
    else { card.querySelector('.answer').classList.remove('show'); clearCardVisual(card); }
  });
}
function resetQuiz() {
  document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
  showAllAnswers = false;
  document.querySelectorAll('.question-card').forEach(clearCardVisual);
  updateStats();
}
function shuffleOptions() {
  questions.forEach(q => {
    const arr = letters.filter(L => q.options[L]);
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    optionOrder[q.id] = arr;
  });
  renderQuestions();
}
function updateStats() {
  let answered = 0, correct = 0, wrong = 0;
  document.querySelectorAll('.question-card').forEach(card => {
    const selected = card.querySelector('input[type="radio"]:checked')?.value;
    if (selected) { answered++; if (selected === card.dataset.correct) correct++; else wrong++; }
  });
  const visibleCards = document.querySelectorAll('.question-card').length;
  el('visibleCount').textContent = visibleCards;
  el('answeredCount').textContent = answered;
  el('correctCount').textContent = correct;
  el('wrongCount').textContent = wrong;
  el('totalMeta').textContent = questions.length;
  el('visibleMeta').textContent = visibleCards;
  el('scoreMeta').textContent = `${correct}/${answered || 0}`;
  if (!visibleCards) el('currentMeta').textContent = `0/${questions.length}`;
}
function loadRows(rows) {
  const normalized = rows.map(normalizeQuestion).filter(q => q.question);
  if (!normalized.length) { alert('Faylda sual tapılmadı. Header-lər: No, Question, A, B, C, D, E, CorrectLetter, CorrectAnswer, SourceFile, Page olmalıdır.'); return; }
  questions = normalized;
  applySavedCorrections();
  optionOrder = {};
  el('uploadStatus').textContent = `${questions.length} sual yükləndi`;
  resetFilters(); renderSources(); renderQuestions();
}
function resetFilters() { el('search').value=''; el('sourceFilter').value=''; showAllAnswers=false; }
function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const name = file.name.toLowerCase();
      if (name.endsWith('.csv')) {
        if (!window.XLSX) throw new Error('CSV parser üçün XLSX kitabxanası yüklənməyib.');
        const wb = XLSX.read(e.target.result, { type:'string' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        loadRows(XLSX.utils.sheet_to_json(ws, { defval:'' }));
      } else {
        if (!window.XLSX) throw new Error('Excel oxuma kitabxanası yüklənmədi. İnternet bağlantısını yoxlayın və ya CSV yükləyin.');
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        loadRows(XLSX.utils.sheet_to_json(ws, { defval:'' }));
      }
    } catch (err) { alert('Fayl yüklənmədi: ' + err.message); }
  };
  if (file.name.toLowerCase().endsWith('.csv')) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
function init() {
  applySavedCorrections();
  renderSources(); renderQuestions();
  el('search').addEventListener('input', renderQuestions);
  el('sourceFilter').addEventListener('change', renderQuestions);
  el('checkBtn').addEventListener('click', checkAnswers);
  el('answersBtn').addEventListener('click', toggleAnswers);
  el('resetBtn').addEventListener('click', resetQuiz);
  el('clearEditsBtn').addEventListener('click', clearSavedCorrections);
  el('shareEditsBtn').addEventListener('click', makeShareableEditsLink);
  el('shuffleBtn').addEventListener('click', shuffleOptions);
  el('excelFile').addEventListener('change', e => handleFile(e.target.files[0]));
  el('sourceMode').addEventListener('change', e => document.body.classList.toggle('show-sources', e.target.checked));
  el('editMode').addEventListener('change', e => {
    document.body.classList.toggle('edit-mode', e.target.checked);
    el('editToggleLabel').classList.toggle('active', e.target.checked);
  });
  el('panelBtn').addEventListener('click', () => el('controls').classList.toggle('collapsed'));
}
init();
</script>
