.search { flex:1 1 210px; min-width:160px; }

button, .file-btn, .toggle { border-radius:9px; padding:8px 10px; font-size:12.5px; font-weight:800; cursor:pointer; min-height:36px; white-space:nowrap; }
button { border:0; background:var(--accent); color:#fff; }

const CORRECTION_STORAGE_KEY = 'ets_doctors_team_quiz_correct_overrides_v1_97a';

function correctionKey(q) {
  return `${q.id}::${String(q.question || '').trim().slice(0, 140)}`;
}
function readSavedCorrections() {
  try { return JSON.parse(localStorage.getItem(CORRECTION_STORAGE_KEY) || '{}') || {}; }
  catch { return {}; }
}
function writeSavedCorrections(data) {
  try { localStorage.setItem(CORRECTION_STORAGE_KEY, JSON.stringify(data)); return true; }
  catch { return false; }
}
function encodeSharePayload(obj) {
  const json = JSON.stringify(obj || {});
  const bytes = new TextEncoder().encode(json);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
function decodeSharePayload(str) {
  try {
    const normalized = String(str || '').replace(/-/g, '+').replace(/_/g, '/');
    const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
    const binary = atob(padded);
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes)) || {};
  } catch { return {}; }
}
function readSharedCorrectionsFromUrl() {
  const hash = window.location.hash || '';
  const match = hash.match(/(?:^#|&)edits=([^&]+)/);
  return match ? decodeSharePayload(match[1]) : {};
}
function getAllCorrections() {
  return { ...readSavedCorrections(), ...readSharedCorrectionsFromUrl() };
}
function persistSharedCorrectionsIfAny() {
  const shared = readSharedCorrectionsFromUrl();
  if (!Object.keys(shared).length) return 0;
  const merged = { ...readSavedCorrections(), ...shared };
  writeSavedCorrections(merged);
  return Object.keys(shared).length;
}
function makeShareableEditsLink() {
  const saved = readSavedCorrections();
  if (!Object.keys(saved).length) {
    alert('Paylaşmaq üçün hələ heç bir edit düzəlişi yoxdur. Əvvəl Edit rejimində düzgün cavabı dəyiş.');
    return;
  }
  const payload = encodeSharePayload(saved);
  const base = window.location.href.split('#')[0];
  const url = `${base}#edits=${payload}`;
  const done = () => { el('uploadStatus').textContent = 'Paylaş linki kopyalandı'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => prompt('Linki kopyala:', url));
  } else {
    prompt('Linki kopyala:', url);
  }
}
function applySavedCorrections() {
  const sharedCount = persistSharedCorrectionsIfAny();
  const saved = getAllCorrections();
  let applied = 0;
  questions.forEach(q => {
    const val = saved[correctionKey(q)];
    if (letters.includes(val)) { q.correct = val; applied++; }
  });
  if (applied) el('uploadStatus').textContent = sharedCount ? `${applied} link/yaddaş düzəlişi tətbiq olundu` : `${applied} yadda saxlanmış düzəliş tətbiq olundu`;
}
function saveCorrectChange(q) {
  const saved = readSavedCorrections();

function normalizeQuestion(raw, index) {
  const get = (...names) => {
    for (const n of names) {
      if (raw[n] !== undefined && raw[n] !== null && String(raw[n]).trim() !== '') return raw[n];
      const found = Object.keys(raw).find(k => String(k).trim().toLowerCase() === n.toLowerCase());
      if (found && raw[found] !== undefined && raw[found] !== null && String(raw[found]).trim() !== '') return raw[found];
    }
    return '';
  };
  const options = {};
  letters.forEach(L => options[L] = String(get(L, L + ')', 'Option ' + L, 'Variant ' + L) || '').trim());
  let correct = String(get('CorrectLetter','Correct','Answer','Düzgün cavab','Duzgun cavab') || '').trim().toUpperCase().slice(0,1);
  if (!letters.includes(correct)) {
    const ca = String(get('CorrectAnswer','Correct Answer') || '').trim();
    correct = letters.find(L => options[L] === ca) || 'A';
  }
  return {
    id: Number(get('No','№','N','ID')) || index + 1,
    question: String(get('Question','Sual','QuestionText') || '').trim(),
    options,
    correct,
    source: String(get('SourceFile','Source','Mənbə','Menbe') || '').trim(),
    page: String(get('Page','Səhifə','Sehife') || '').trim()
  };
}

  const cards = [];
  questions.forEach((q) => {
    const hay = [q.question, ...letters.map(L => q.options[L]), q.source, q.page].join(' ').toLowerCase();
    if (search && !hay.includes(search)) return;
    if (source && q.source !== source) return;
    filteredIds.add(q.id);
    const visibleNo = cards.length + 1;
    const order = getOrder(q);
    const opts = order.map(L => `<label class="option" data-letter="${L}">
        <input type="radio" name="q${q.id}" value="${L}">
        <span><strong>${L})</strong> ${escapeHtml(q.options[L])}</span>
      </label>`).join('');
    const editOptions = letters.map(L => `<option value="${L}" ${q.correct===L?'selected':''}>${L}</option>`).join('');
    cards.push(`<section class="question-card" data-id="${q.id}" data-source="${escapeHtml(q.source)}" data-correct="${q.correct}">
      <div class="question-top">
        <div class="q-title">${visibleNo}. ${escapeHtml(q.question)}</div>
        <div class="badges">
          ${q.excelNo ? `<span class="badge">№: ${escapeHtml(q.excelNo)}</span>` : ''}
          ${q.source ? `<span class="badge">Source: ${escapeHtml(q.source)}</span>` : ''}
          ${q.page ? `<span class="badge">Page: ${escapeHtml(q.page)}</span>` : ''}
        </div>
      </div>
      <div class="options">${opts}</div>
      <div class="result" aria-live="polite"></div>
      <div class="answer">Düzgün cavab: <strong>${escapeHtml(correctText(q))}</strong></div>
      <div class="edit-tools">
        <label>Düzgün cavab:</label>
        <select class="correct-editor" data-id="${q.id}">${editOptions}</select>
        <span class="edit-note">Edit rejimi aktivdir</span>
      </div>
    </section>`);
  });
  wrap.innerHTML = cards.join('') || '<div class="empty">Uyğun sual tapılmadı.</div>';
  bindQuestionEvents();
  setupCurrentQuestionObserver();
  updateStats();
}
function bindQuestionEvents() {
  document.querySelectorAll('.option input').forEach(inp => {
    inp.addEventListener('change', e => {
      const card = e.target.closest('.question-card');
      clearCardVisual(card);
      if (el('instantMode').checked) revealCard(card, true);
      updateStats();
    });
  });
  document.querySelectorAll('.correct-editor').forEach(sel => {
    sel.addEventListener('change', e => {
      const q = questions.find(x => String(x.id) === String(e.target.dataset.id));
      if (!q) return;
      q.correct = e.target.value;
      saveCorrectChange(q);
      const card = document.querySelector(`.question-card[data-id="${q.id}"]`);
      if (card) {
        card.dataset.correct = q.correct;
        card.querySelector('.answer').innerHTML = `Düzgün cavab: <strong>${escapeHtml(correctText(q))}</strong>`;
        clearCardVisual(card);
      }
      updateStats();
    });
  });
}
function setupCurrentQuestionObserver() {
  if (currentQuestionObserver) currentQuestionObserver.disconnect();
  const cards = [...document.querySelectorAll('.question-card')];
  if (!cards.length) {
    el('currentMeta').textContent = `0/${questions.length}`;
    return;
  }
  el('currentMeta').textContent = `1/${cards.length}`;
  currentQuestionObserver = new IntersectionObserver(entries => {
    const visible = entries
      .filter(entry => entry.isIntersecting)
      .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    const index = cards.indexOf(visible.target) + 1;
    el('currentMeta').textContent = `${index}/${cards.length}`;
  }, { root: el('quizScroll'), threshold:[0.35, 0.55, 0.75], rootMargin:'-8px 0px -45% 0px' });
  cards.forEach(card => currentQuestionObserver.observe(card));
}

function clearCardVisual(card) {
  card.querySelectorAll('.option').forEach(o => o.classList.remove('correct','wrong'));
  const result = card.querySelector('.result');
  result.textContent = ''; result.className = 'result';
  if (!showAllAnswers) card.querySelector('.answer').classList.remove('show');
}
function revealCard(card, markWrong=false) {
  const correct = card.dataset.correct;
  const selected = card.querySelector('input[type="radio"]:checked')?.value;
  card.querySelectorAll('.option').forEach(o => {
    const L = o.dataset.letter;
    o.classList.toggle('correct', L === correct);
    o.classList.toggle('wrong', markWrong && selected && L === selected && selected !== correct);
  });
  const answer = card.querySelector('.answer');
  answer.classList.add('show');
  const result = card.querySelector('.result');
  if (selected) {
    if (selected === correct) { result.textContent = 'Düzgündür'; result.className = 'result ok'; }
    else { result.textContent = 'Səhvdir'; result.className = 'result bad'; }
  }
}
function checkAnswers() {
  document.querySelectorAll('.question-card').forEach(card => {
    const selected = card.querySelector('input[type="radio"]:checked');
    if (selected) {
      revealCard(card, true);
    } else {
      const ans = card.querySelector('.answer');
      if (ans) ans.classList.remove('show');
      clearCardVisual(card);
    }
  });
  updateStats(true);
}
function toggleAnswers() {
  showAllAnswers = !showAllAnswers;
  document.querySelectorAll('.question-card').forEach(card => {
    if (showAllAnswers) revealCard(card, false);
    else { card.querySelector('.answer').classList.remove('show'); clearCardVisual(card); }
  });
}
function resetQuiz() {
  document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
  showAllAnswers = false;
  document.querySelectorAll('.question-card').forEach(clearCardVisual);
  updateStats();
}
function shuffleOptions() {
  questions.forEach(q => {
    const arr = letters.filter(L => q.options[L]);
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    optionOrder[q.id] = arr;
  });
  renderQuestions();
}
function updateStats() {
  let answered = 0, correct = 0, wrong = 0;
  document.querySelectorAll('.question-card').forEach(card => {
    const selected = card.querySelector('input[type="radio"]:checked')?.value;
    if (selected) { answered++; if (selected === card.dataset.correct) correct++; else wrong++; }
  });
  const visibleCards = document.querySelectorAll('.question-card').length;
  el('visibleCount').textContent = visibleCards;
  el('answeredCount').textContent = answered;
  el('correctCount').textContent = correct;
  el('wrongCount').textContent = wrong;
  el('totalMeta').textContent = questions.length;
  el('visibleMeta').textContent = visibleCards;
  el('scoreMeta').textContent = `${correct}/${answered || 0}`;
  if (!visibleCards) el('currentMeta').textContent = `0/${questions.length}`;
}
function loadRows(rows) {
  const normalized = rows.map(normalizeQuestion).filter(q => q.question);
  if (!normalized.length) { alert('Faylda sual tapılmadı. Header-lər: No, Question, A, B, C, D, E, CorrectLetter, CorrectAnswer, SourceFile, Page olmalıdır.'); return; }
  questions = normalized;
  applySavedCorrections();
  optionOrder = {};
  el('uploadStatus').textContent = `${questions.length} sual yükləndi`;
  resetFilters(); renderSources(); renderQuestions();
}
function resetFilters() { el('search').value=''; el('sourceFilter').value=''; showAllAnswers=false; }
function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const name = file.name.toLowerCase();
      if (name.endsWith('.csv')) {
        if (!window.XLSX) throw new Error('CSV parser üçün XLSX kitabxanası yüklənməyib.');
        const wb = XLSX.read(e.target.result, { type:'string' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        loadRows(XLSX.utils.sheet_to_json(ws, { defval:'' }));
      } else {
        if (!window.XLSX) throw new Error('Excel oxuma kitabxanası yüklənmədi. İnternet bağlantısını yoxlayın və ya CSV yükləyin.');
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        loadRows(XLSX.utils.sheet_to_json(ws, { defval:'' }));
      }
    } catch (err) { alert('Fayl yüklənmədi: ' + err.message); }
  };
  if (file.name.toLowerCase().endsWith('.csv')) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
function init() {
  applySavedCorrections();
  renderSources(); renderQuestions();
  el('search').addEventListener('input', renderQuestions);
  el('sourceFilter').addEventListener('change', renderQuestions);
  el('checkBtn').addEventListener('click', checkAnswers);
  el('answersBtn').addEventListener('click', toggleAnswers);
  el('resetBtn').addEventListener('click', resetQuiz);
  el('clearEditsBtn').addEventListener('click', clearSavedCorrections);
  el('shareEditsBtn').addEventListener('click', makeShareableEditsLink);
  el('shuffleBtn').addEventListener('click', shuffleOptions);
  el('excelFile').addEventListener('change', e => handleFile(e.target.files[0]));
  el('sourceMode').addEventListener('change', e => document.body.classList.toggle('show-sources', e.target.checked));
  el('editMode').addEventListener('change', e => {
    document.body.classList.toggle('edit-mode', e.target.checked);
    el('editToggleLabel').classList.toggle('active', e.target.checked);
  });
  el('panelBtn').addEventListener('click', () => el('controls').classList.toggle('collapsed'));
}
init();
</script>
