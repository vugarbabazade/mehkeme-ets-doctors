let questions = structuredClone(INITIAL_QUESTIONS);
let selected = {};
let revealed = {};
let showAnswers = false;
let checkedAll = false;
let currentQuestionObserver = null;
const STORAGE_KEY = 'anesteziya_qapali_aciq_mixed_v1';
const els = {
  search: document.getElementById('search'), sectionFilter: document.getElementById('sectionFilter'), instantMode: document.getElementById('instantMode'), sourceMode: document.getElementById('sourceMode'),
  checkBtn: document.getElementById('checkBtn'), answersBtn: document.getElementById('answersBtn'), resetBtn: document.getElementById('resetBtn'), shuffleBtn: document.getElementById('shuffleBtn'),
  questions: document.getElementById('questions'), quizScroll: document.getElementById('quizScroll'), totalMeta: document.getElementById('totalMeta'), visibleMeta: document.getElementById('visibleMeta'), currentMeta: document.getElementById('currentMeta'), scoreMeta: document.getElementById('scoreMeta'),
  visibleCount: document.getElementById('visibleCount'), answeredCount: document.getElementById('answeredCount'), correctCount: document.getElementById('correctCount'), wrongCount: document.getElementById('wrongCount')
};
function escapeHtml(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function normAns(arr){return [...new Set((arr||[]).map(x=>parseInt(x,10)).filter(n=>Number.isFinite(n)))].sort((a,b)=>a-b);}
function sameAns(a,b){a=normAns(a);b=normAns(b);return a.length===b.length&&a.every((x,i)=>x===b[i]);}
function labelFor(q,n){return (q.labels && q.labels[n-1]) ? q.labels[n-1] : String(n);}
function isAnswered(q){return normAns(selected[q.id]).length>0;}
function isCorrect(q){return sameAns(selected[q.id], q.correct);}
function correctText(q){return normAns(q.correct).map(n=>`${labelFor(q,n)}) ${q.options[n-1]||''}`).join('; ');}
function saveState(){try{localStorage.setItem(STORAGE_KEY, JSON.stringify({selected,revealed,checkedAll,showAnswers}));}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); selected=s.selected||{}; revealed=s.revealed||{}; checkedAll=!!s.checkedAll; showAnswers=!!s.showAnswers;}catch(e){selected={};revealed={};checkedAll=false;showAnswers=false;}}
function buildSectionFilter(){const current=els.sectionFilter.value;const sections=[...new Set(questions.map(q=>q.category||'Baza'))];els.sectionFilter.innerHTML='<option value="">Bütün suallar</option>'+sections.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');if(sections.includes(current))els.sectionFilter.value=current;}
function filteredQuestions(){const term=(els.search.value||'').toLowerCase().trim();const section=els.sectionFilter.value||'';return questions.filter(q=>{if(section && q.category!==section)return false;if(!term)return true;return [q.question,...q.options,q.category,q.source,q.section,q.page,q.excelNo].join(' ').toLowerCase().includes(term);});}
function revealState(q){return checkedAll || !!revealed[q.id];}
function render(){
  const filtered=filteredQuestions();const total=questions.length,visible=filtered.length;els.totalMeta.textContent=total;els.visibleMeta.textContent=visible;els.currentMeta.textContent=visible?`1/${visible}`:`0/${total}`;els.visibleCount.textContent=visible;
  let ans=0,ok=0,bad=0;questions.forEach(q=>{if(isAnswered(q)){ans++; if(revealState(q)){if(isCorrect(q))ok++;else bad++;}}});els.answeredCount.textContent=ans;els.correctCount.textContent=ok;els.wrongCount.textContent=bad;els.scoreMeta.textContent=`${ok}/${ans||0}`;
  if(!visible){els.questions.innerHTML='<div class="empty">Sual tapılmadı.</div>';return;}
  els.questions.innerHTML=filtered.map((q,idx)=>{
    const selectedSet=new Set(normAns(selected[q.id]));const correctSet=new Set(normAns(q.correct));const isMulti=q.type==='multi';const isRevealed=revealState(q);const showAns=showAnswers||isRevealed;
    const opts=q.options.map((opt,i)=>{const n=i+1;const inputType=isMulti?'checkbox':'radio';let cls='';if(showAns && correctSet.has(n))cls+=' correct';if(isRevealed && selectedSet.has(n) && !correctSet.has(n))cls+=' wrong';const ch=selectedSet.has(n)?'checked':'';return `<label class="option${cls}" data-q="${q.id}" data-n="${n}"><input type="${inputType}" name="q_${q.id}" value="${n}" ${ch}><span><strong>${escapeHtml(labelFor(q,n))})</strong> ${escapeHtml(opt)}</span></label>`;}).join('');
    const res=(isRevealed && isAnswered(q))?`<div class="result ${isCorrect(q)?'ok':'bad'}">${isCorrect(q)?'Düzgündür':'Səhvdir'}</div>`:'';
    const kindBadge=isMulti?'<span class="badge multi-badge">Açıq / çox seçimli</span>':'<span class="badge single-badge">Qapalı / tək seçimli</span>';
    const sectionText=q.category==='Açıq suallar' && q.section ? `${q.category} — ${q.section}` : q.category;
    return `<section class="question-card" data-id="${q.id}" data-kind="${isMulti?'multi':'single'}"><div class="question-top"><div class="q-title">${idx+1}. ${escapeHtml(q.question)}</div><div class="badges">${kindBadge}<span class="badge">${escapeHtml(sectionText||'')}</span>${q.excelNo?`<span class="badge">№: ${escapeHtml(q.excelNo)}</span>`:''}${q.source?`<span class="badge">Source: ${escapeHtml(q.source)}</span>`:''}${q.page?`<span class="badge">Page: ${escapeHtml(q.page)}</span>`:''}</div></div><div class="options">${opts}</div><div class="answer ${showAns?'show':''}"><strong>Düzgün cavab:</strong> ${escapeHtml(correctText(q))}</div>${res}</section>`;
  }).join('');
  bindQuestionEvents();setupCurrentQuestionObserver();
}
function bindQuestionEvents(){document.querySelectorAll('.option input').forEach(inp=>{inp.addEventListener('change',e=>{const card=e.target.closest('.question-card');const qid=Number(card.dataset.id);const q=questions.find(x=>x.id===qid);if(!q)return;if(q.type==='single'){selected[qid]=[Number(e.target.value)];if(els.instantMode.checked)revealed[qid]=true;else if(!checkedAll)delete revealed[qid];}else{selected[qid]=normAns([...card.querySelectorAll('input:checked')].map(x=>Number(x.value)));if(!checkedAll)delete revealed[qid];}saveState();render();});});}
function setupCurrentQuestionObserver(){if(currentQuestionObserver)currentQuestionObserver.disconnect();const cards=[...document.querySelectorAll('.question-card')];if(!cards.length){els.currentMeta.textContent=`0/${questions.length}`;return;}els.currentMeta.textContent=`1/${cards.length}`;currentQuestionObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!visible)return;const index=cards.indexOf(visible.target)+1;els.currentMeta.textContent=`${index}/${cards.length}`; },{root:els.quizScroll,threshold:[0.35,0.55,0.75],rootMargin:'-8px 0px -45% 0px'});cards.forEach(c=>currentQuestionObserver.observe(c));}
function checkAnswers(){checkedAll=true;questions.forEach(q=>{revealed[q.id]=true;});saveState();render();}
function toggleAnswers(){showAnswers=!showAnswers;saveState();render();}
function resetQuiz(){selected={};revealed={};showAnswers=false;checkedAll=false;saveState();render();}
function shuffleQuestions(){for(let i=questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]];}render();els.quizScroll.scrollTo({top:0,behavior:'smooth'});}
els.search.addEventListener('input',render);els.sectionFilter.addEventListener('change',render);els.sourceMode.addEventListener('change',()=>{document.body.classList.toggle('show-sources',els.sourceMode.checked);});els.checkBtn.addEventListener('click',checkAnswers);els.answersBtn.addEventListener('click',toggleAnswers);els.resetBtn.addEventListener('click',resetQuiz);els.shuffleBtn.addEventListener('click',shuffleQuestions);
loadState();buildSectionFilter();render();
</script></body></html>
